server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /search        # 모든 URL은 /search 하위로 서빙
  forward-headers-strategy: framework   # X-Forwarded-For 처리 (클라이언트 IP 추출)

spring:
  application:
    name: search
  profiles:
    active: local                # 추가 오버라이드는 application-local.yml (git 미추적, 없어도 무방)
  datasource:                    # 접속 정보는 환경 변수(.env.example 참조) 또는 local 프로파일로 주입
    url: ${DB_URL:jdbc:postgresql://localhost:5432/search?currentSchema=search,public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    default-schema: ${DB_SCHEMA:search}   # search 스키마에 모든 객체 생성 (스키마 없으면 자동 생성)
  task:
    scheduling:
      pool:
        size: 2                  # 색인 동기화 + 인기검색어 MV 갱신

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml
  type-aliases-package: com.gonet.search.domain, com.gonet.search.dto
  configuration:
    map-underscore-to-camel-case: true   # snake_case 컬럼 → camelCase 필드 자동 매핑

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

management:
  server:
    port: 9090                   # 관리 포트 분리 (context path 영향 없음)
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, caches
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0           # 개발: 100%, 운영: 0.1 권장

search:
  index:
    sync-cron: "0 0 6,18 * * *"  # 색인 동기화 (매일 2회)
    chunk-size: 500
    sync-on-startup: true        # 기동 직후 1회 동기화 (운영에서 부담되면 false)
  analyzer:
    keep-pos: NNG, NNP, SL, SN   # 색인·검색 대상 품사 (변경 시 전체 재색인 필요)
  keyword:
    popular-refresh-cron: "0 */10 * * * *"  # 인기 검색어 MV 자동 갱신 (10분마다)
  result:
    group-order: CONTENT, BBS, FILE, MENU   # 전체 탭 카테고리 그룹 출력 순서
    group-size: 10                          # 그룹당 노출 건수 (초과 시 "더보기")
    summary-length: 2000                    # 목록 출력 본문 길이
