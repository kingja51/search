server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /search        # 모든 URL은 /search 하위로 서빙
    session:
      tracking-modes: cookie     # URL 리라이팅(;jsessionid=...) 방지 — 링크(원본) 표기를 깨끗하게 유지
  forward-headers-strategy: framework   # X-Forwarded-For 처리 (클라이언트 IP 추출)

spring:
  application:
    name: search
  profiles:
    active: local                # 추가 오버라이드는 application-local.yml (git 미추적, 없어도 무방)
  datasource:                    # 접속 정보는 환경 변수(.env.example 참조) 또는 local 프로파일로 주입
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=search,extensions,public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    default-schema: ${DB_SCHEMA:search}   # search 스키마에 모든 객체 생성 (스키마 없으면 자동 생성)
    baseline-on-migrate: true    # 수동 설치(정리본 SQL)된 기존 스키마를 기준선으로 인정하고 기동
    baseline-version: "4"        # V1~V4는 이미 반영된 것으로 간주 — V5부터 새 마이그레이션 적용
                                 # (빈 스키마에서 시작하면 baseline 없이 V1~V4를 정상 적용한다)
  task:
    scheduling:
      pool:
        size: 2                  # 색인 동기화 + 인기검색어 MV 갱신

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml
  type-aliases-package: com.gonet.search.domain, com.gonet.search.dto
  configuration:
    map-underscore-to-camel-case: true   # snake_case 컬럼 → camelCase 필드 자동 매핑

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

management:
  server:
    port: ${MANAGEMENT_PORT:9090}   # 관리 포트 분리 (context path 영향 없음)
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, caches
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0           # 개발: 100%, 운영: 0.1 권장
  metrics:
    distribution:
      percentiles-histogram:
        search.query: true       # Grafana p95/p99 (histogram_quantile) 계산용 버킷 노출

search:
  trust-forwarded-header: false  # 리버스 프록시 뒤 배포 시에만 true — 직접 노출 환경에서 XFF 신뢰 시 IP 위조 가능
  doc-types:                     # 검색 대상 정의의 단일 소스 — 순서 = 통합검색 그룹·좌측 메뉴 노출 순서
    CONTENT: 컨텐츠               #   새 검색 VIEW 추가 시 여기 한 줄만 추가하면 화면 전체에 반영
    BBS: 게시판                   #   (docs/add-search-source.md)
    FILE: 파일
    MENU: 메뉴
  index:
    sync-cron: "0 0 6,18 * * *"  # 색인 동기화 (매일 2회)
    chunk-size: 500
    sync-on-startup: true        # 기동 직후 1회 동기화 (운영에서 부담되면 false)
  analyzer:
    keep-pos: NNG, NNP, SL, SN   # 색인·검색 대상 품사 (변경 시 전체 재색인 필요)
  keyword:
    popular-refresh-cron: "0 */10 * * * *"  # 인기 검색어 MV 자동 갱신 (10분마다)
  extract:
    cron: "0 0 1 * * *"          # 파일 텍스트 추출 (매일 새벽 1시)
    schedule-days: 3             # 스케줄 대상: 최근 N일 (매일 실행되므로 짧은 윈도우 + 겹침 여유)
    manual-months: 1             # 어드민 [파일 추출] 버튼 대상: 최근 N개월
    update-origin: false         # 추출 본문 반영 방식 — false(기본): tn_search_index만 직접 갱신(원본 불변, 전체 재색인 시 초기화)
                                 #                       true: tn_file.extract_text에 저장 → 색인 동기화 자동 연쇄(재색인에도 유지, 뷰어 노출)
    # 선언된 확장자만 추출 처리 (대소문자 무시)
    # DOC~CSV: Apache Tika(POI·PDFBox) / HWP·HWPX: hwplib·hwpxlib (rhwp는 Rust/WASM이라 자바 미지원 — 대체)
    extensions: DOC, DOCX, XLS, XLSX, PPT, PPTX, PDF, TXT, CSV, HWP, HWPX
  result:
    group-size: 10                          # 통합검색 그룹당 노출 건수 (초과 시 "더보기") — 그룹 순서는 doc-types 순서
    summary-length: 2000                    # 목록 출력 본문 길이
