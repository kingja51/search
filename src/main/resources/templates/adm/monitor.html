<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/search/admin}">
<head>
    <title>모니터</title>
</head>
<body>
<main layout:fragment="content">
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-lg font-bold">모니터 <span class="text-xs font-normal text-gray-400">(Micrometer/Prometheus 메트릭)</span></h1>
        <span class="text-xs text-gray-400">5초 간격 갱신 · <span id="last-updated">-</span></span>
    </div>

    <!-- 상단 스탯 카드 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <div class="bg-white border border-gray-200 rounded-xl p-3.5">
            <p class="text-[11px] text-gray-400">누적 검색 수</p>
            <p class="text-xl font-bold" id="stat-count">-</p>
        </div>
        <div class="bg-white border border-gray-200 rounded-xl p-3.5">
            <p class="text-[11px] text-gray-400">평균 응답 (전체 누적)</p>
            <p class="text-xl font-bold" id="stat-avg">-</p>
        </div>
        <div class="bg-white border border-gray-200 rounded-xl p-3.5">
            <p class="text-[11px] text-gray-400">무결과 검색</p>
            <p class="text-xl font-bold text-amber-600" id="stat-noresult">-</p>
        </div>
        <div class="bg-white border border-gray-200 rounded-xl p-3.5">
            <p class="text-[11px] text-gray-400">금지어 차단</p>
            <p class="text-xl font-bold text-red-600" id="stat-blocked">-</p>
        </div>
    </div>

    <!-- 차트 4종 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-white border border-gray-200 rounded-xl p-4">
            <h2 class="text-sm font-semibold mb-2">검색 처리량 (건/초)</h2>
            <canvas id="chart-qps" height="170"></canvas>
        </div>
        <div class="bg-white border border-gray-200 rounded-xl p-4">
            <h2 class="text-sm font-semibold mb-2">평균 응답시간 (ms, 폴링 구간)</h2>
            <canvas id="chart-latency" height="170"></canvas>
        </div>
        <div class="bg-white border border-gray-200 rounded-xl p-4">
            <h2 class="text-sm font-semibold mb-2">캐시 히트율 (%)</h2>
            <canvas id="chart-cache" height="170"></canvas>
        </div>
        <div class="bg-white border border-gray-200 rounded-xl p-4">
            <h2 class="text-sm font-semibold mb-2">색인 문서 수 (도메인별)</h2>
            <canvas id="chart-index" height="170"></canvas>
        </div>
    </div>

    <!-- 배치 현황 -->
    <div class="bg-white border border-gray-200 rounded-xl p-4 mt-4 text-[13px]">
        <h2 class="text-sm font-semibold mb-2">배치 현황</h2>
        <div id="batch-info" class="text-gray-600">아직 실행 이력이 없습니다.</div>
    </div>

    <script th:src="@{/webjars/chart.js/4.4.9/dist/chart.umd.js}"></script>
    <script th:inline="javascript">
        const API_URL = /*[[@{/adm/monitor/summary}]]*/ '/search/adm/monitor/summary';
        const MAX_POINTS = 60;                      // 5초 × 60 = 최근 5분
        const PRIMARY = '#2563eb';
        const PALETTE = ['#2563eb', '#16a34a', '#f59e0b', '#dc2626', '#7c3aed', '#0891b2'];

        let prev = null;                            // 누적치 차분(QPS·구간 평균) 계산용 직전 스냅샷
        const labels = [];
        const qpsData = [];
        const latencyData = { total: [], analyze: [], expand: [], fts: [], highlight: [] };

        const qpsChart = new Chart(document.getElementById('chart-qps'), {
            type: 'line',
            data: { labels, datasets: [{ label: '검색/s', data: qpsData, borderColor: PRIMARY,
                    backgroundColor: PRIMARY + '22', fill: true, tension: 0.3, pointRadius: 0 }] },
            options: { animation: false, scales: { y: { beginAtZero: true } }, plugins: { legend: { display: false } } }
        });

        const latencyChart = new Chart(document.getElementById('chart-latency'), {
            type: 'line',
            data: { labels, datasets: [
                { label: '전체', data: latencyData.total, borderColor: PRIMARY, tension: 0.3, pointRadius: 0 },
                { label: 'analyze', data: latencyData.analyze, borderColor: PALETTE[1], tension: 0.3, pointRadius: 0, hidden: true },
                { label: 'expand', data: latencyData.expand, borderColor: PALETTE[2], tension: 0.3, pointRadius: 0, hidden: true },
                { label: 'fts', data: latencyData.fts, borderColor: PALETTE[3], tension: 0.3, pointRadius: 0 },
                { label: 'highlight', data: latencyData.highlight, borderColor: PALETTE[4], tension: 0.3, pointRadius: 0, hidden: true }
            ] },
            options: { animation: false, scales: { y: { beginAtZero: true } },
                       plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } }
        });

        const cacheChart = new Chart(document.getElementById('chart-cache'), {
            type: 'bar',
            data: { labels: [], datasets: [{ label: '히트율 %', data: [], backgroundColor: PRIMARY + 'cc' }] },
            options: { animation: false, indexAxis: 'y',
                       scales: { x: { min: 0, max: 100 } }, plugins: { legend: { display: false } } }
        });

        const indexChart = new Chart(document.getElementById('chart-index'), {
            type: 'bar',
            data: { labels: [], datasets: [{ label: '문서 수', data: [], backgroundColor: PALETTE.map(c => c + 'cc') }] },
            options: { animation: false, scales: { y: { beginAtZero: true } }, plugins: { legend: { display: false } } }
        });

        function pushRolling(arr, value) {
            arr.push(value);
            if (arr.length > MAX_POINTS) arr.shift();
        }

        function deltaRate(cur, prv, seconds) {
            return Math.max(0, (cur - prv)) / seconds;
        }
        function deltaMean(curTotal, prvTotal, curCount, prvCount) {
            const dc = curCount - prvCount;
            return dc > 0 ? (curTotal - prvTotal) / dc : null;
        }

        async function poll() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) return;
                const d = await res.json();
                const now = new Date(d.timestamp);
                document.getElementById('last-updated').textContent = now.toLocaleTimeString();

                document.getElementById('stat-count').textContent = d.search.count.toLocaleString();
                document.getElementById('stat-avg').textContent =
                    d.search.count > 0 ? (d.search.totalTimeMs / d.search.count).toFixed(1) + ' ms' : '-';
                document.getElementById('stat-noresult').textContent = d.search.noresult.toLocaleString();
                document.getElementById('stat-blocked').textContent = d.search.blocked.toLocaleString();

                if (prev) {
                    const sec = (d.timestamp - prev.timestamp) / 1000;
                    pushRolling(labels, now.toLocaleTimeString());
                    pushRolling(qpsData, deltaRate(d.search.count, prev.search.count, sec));
                    pushRolling(latencyData.total,
                        deltaMean(d.search.totalTimeMs, prev.search.totalTimeMs, d.search.count, prev.search.count));
                    for (const k of ['analyze', 'expand', 'fts', 'highlight']) {
                        pushRolling(latencyData[k],
                            deltaMean(d.spans[k].totalTimeMs, prev.spans[k].totalTimeMs,
                                      d.spans[k].count, prev.spans[k].count));
                    }
                    qpsChart.update();
                    latencyChart.update();
                }
                prev = d;

                const names = Object.keys(d.caches);
                cacheChart.data.labels = names;
                cacheChart.data.datasets[0].data = names.map(n => {
                    const hit = d.caches[n].hit || 0, miss = d.caches[n].miss || 0;
                    return hit + miss > 0 ? +(hit / (hit + miss) * 100).toFixed(1) : 0;
                });
                cacheChart.update();

                indexChart.data.labels = Object.keys(d.indexDocuments);
                indexChart.data.datasets[0].data = Object.values(d.indexDocuments);
                indexChart.update();

                const b = d.batch;
                const parts = [];
                if (b['sync.diff.count']) parts.push(`색인 동기화(diff): ${b['sync.diff.count']}회 · 평균 ${b['sync.diff.meanMs'].toFixed(0)}ms`);
                if (b['sync.full.count']) parts.push(`전체 재색인(full): ${b['sync.full.count']}회 · 평균 ${b['sync.full.meanMs'].toFixed(0)}ms`);
                if (b['popularRefresh.count']) parts.push(`인기검색어 MV 갱신: ${b['popularRefresh.count']}회 · 평균 ${b['popularRefresh.meanMs'].toFixed(0)}ms`);
                if (parts.length) document.getElementById('batch-info').innerHTML = parts.join('<br>');
            } catch (e) { /* 다음 폴링에 재시도 */ }
        }

        poll();
        setInterval(poll, 5000);
    </script>
</main>
</body>
</html>
