<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/search/admin}">
<head>
    <title>검색 통계</title>
</head>
<body>
<main layout:fragment="content">
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-lg font-bold">검색 통계</h1>
        <form th:action="@{/adm/stats}" method="get" class="flex items-center gap-2 text-[13px]">
            <select name="days" onchange="this.form.submit()"
                    class="border border-gray-200 rounded-lg px-2 py-1.5 bg-white">
                <option value="7" th:selected="${days == 7}">최근 7일</option>
                <option value="30" th:selected="${days == 30}">최근 30일</option>
                <option value="90" th:selected="${days == 90}">최근 90일</option>
            </select>
        </form>
    </div>

    <!-- 요약 -->
    <div class="grid grid-cols-3 gap-3 mb-5">
        <div class="bg-white border border-gray-200 rounded-xl p-4">
            <p class="text-[11px] text-gray-400">총 검색</p>
            <p class="text-xl font-bold" th:text="${summary['total']}">0</p>
        </div>
        <div class="bg-white border border-gray-200 rounded-xl p-4">
            <p class="text-[11px] text-gray-400">무결과 검색</p>
            <p class="text-xl font-bold text-amber-600" th:text="${summary['noresult']}">0</p>
        </div>
        <div class="bg-white border border-gray-200 rounded-xl p-4">
            <p class="text-[11px] text-gray-400">금지어 차단</p>
            <p class="text-xl font-bold text-red-600" th:text="${summary['blocked']}">0</p>
        </div>
    </div>

    <!-- 차트 4종 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
        <div class="bg-white border border-gray-200 rounded-xl p-4">
            <h2 class="text-sm font-semibold mb-2">일별 검색량 (최근 14일)</h2>
            <canvas id="chart-daily" height="180"></canvas>
        </div>
        <div class="bg-white border border-gray-200 rounded-xl p-4">
            <h2 class="text-sm font-semibold mb-2">시간대별 검색량 (0~23시)</h2>
            <canvas id="chart-hour" height="180"></canvas>
        </div>
        <div class="bg-white border border-gray-200 rounded-xl p-4">
            <h2 class="text-sm font-semibold mb-2">검색 대상(탭)별 분포</h2>
            <canvas id="chart-type" height="180"></canvas>
        </div>
        <div class="bg-white border border-gray-200 rounded-xl p-4">
            <h2 class="text-sm font-semibold mb-2">색인 카테고리 분포 (도메인 · 카테고리)</h2>
            <canvas id="chart-category" height="180"></canvas>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- 인기 검색어 TOP 20 -->
        <div class="bg-white border border-gray-200 rounded-xl p-4">
            <h2 class="text-sm font-semibold mb-3">인기 검색어 TOP 20</h2>
            <p th:if="${#lists.isEmpty(popular)}" class="text-[12px] text-gray-400">데이터가 없습니다.</p>
            <ol class="space-y-1.5 text-[13px]">
                <li th:each="p, st : ${popular}" class="flex items-center gap-2">
                    <span class="w-6 text-center font-bold"
                          th:classappend="${st.index < 3} ? 'text-primary' : 'text-gray-400'"
                          th:text="${st.count}">1</span>
                    <a th:href="@{/result(q=${p.keyword})}" class="hover:underline" th:text="${p.keyword}">키워드</a>
                    <span class="ml-auto text-[11px] text-gray-400" th:text="${p.searchCount} + '회'">0</span>
                </li>
            </ol>
        </div>

        <!-- 무결과 검색어 TOP 20 (사전 보강 단서) -->
        <div class="bg-white border border-gray-200 rounded-xl p-4">
            <h2 class="text-sm font-semibold mb-1">무결과 검색어 TOP 20</h2>
            <p class="text-[11px] text-gray-400 mb-3">사용자가 찾았지만 결과가 없던 검색어 — 단어/동의어 사전 보강 단서</p>
            <p th:if="${#lists.isEmpty(noResult)}" class="text-[12px] text-gray-400">데이터가 없습니다.</p>
            <ol class="space-y-1.5 text-[13px]">
                <li th:each="n, st : ${noResult}" class="flex items-center gap-2">
                    <span class="w-6 text-center font-bold text-amber-500" th:text="${st.count}">1</span>
                    <a th:href="@{/result(q=${n.key})}" class="hover:underline" th:text="${n.key}">키워드</a>
                    <span class="ml-auto text-[11px] text-gray-400" th:text="${n.count} + '회'">0</span>
                </li>
            </ol>
        </div>
    </div>

    <script th:src="@{/webjars/chart.js/4.4.9/dist/chart.umd.js}"></script>
    <script th:inline="javascript">
        const PRIMARY = '#2563eb';
        const PALETTE = ['#2563eb', '#16a34a', '#f59e0b', '#dc2626', '#7c3aed', '#0891b2', '#db2777', '#65a30d'];

        // 서버 모델 → JSON (KeyCount: {key, count})
        const daily = /*[[${daily}]]*/ [];
        const byHour = /*[[${byHour}]]*/ [];
        const byType = /*[[${byType}]]*/ [];
        const indexByCategory = /*[[${indexByCategory}]]*/ [];

        const typeLabel = k => ({ALL: '통합', CONTENT: '컨텐츠', FILE: '파일', BBS: '게시판', MENU: '메뉴'}[k] || k);

        // 일별 검색량 — 막대
        new Chart(document.getElementById('chart-daily'), {
            type: 'bar',
            data: {
                labels: daily.map(d => d.key),
                datasets: [{ label: '검색 수', data: daily.map(d => d.count),
                             backgroundColor: PRIMARY + 'b3', borderRadius: 4 }]
            },
            options: { animation: false, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
                       plugins: { legend: { display: false } } }
        });

        // 시간대별 검색량 — 0~23시 전체 축 채우기
        const hourMap = Object.fromEntries(byHour.map(h => [h.key, h.count]));
        const hourLabels = Array.from({length: 24}, (_, i) => String(i).padStart(2, '0'));
        new Chart(document.getElementById('chart-hour'), {
            type: 'bar',
            data: {
                labels: hourLabels.map(h => h + '시'),
                datasets: [{ label: '검색 수', data: hourLabels.map(h => hourMap[h] || 0),
                             backgroundColor: PALETTE[5] + 'b3', borderRadius: 3 }]
            },
            options: { animation: false, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
                       plugins: { legend: { display: false } } }
        });

        // 검색 대상(탭)별 분포 — 도넛
        new Chart(document.getElementById('chart-type'), {
            type: 'doughnut',
            data: {
                labels: byType.map(t => typeLabel(t.key)),
                datasets: [{ data: byType.map(t => t.count),
                             backgroundColor: byType.map((_, i) => PALETTE[i % PALETTE.length] + 'cc') }]
            },
            options: { animation: false,
                       plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } } } }
        });

        // 색인 카테고리 분포 — 가로 막대
        new Chart(document.getElementById('chart-category'), {
            type: 'bar',
            data: {
                labels: indexByCategory.map(c => c.key),
                datasets: [{ label: '문서 수', data: indexByCategory.map(c => c.count),
                             backgroundColor: PALETTE[1] + 'b3', borderRadius: 3 }]
            },
            options: { animation: false, indexAxis: 'y',
                       scales: { x: { beginAtZero: true, ticks: { precision: 0 } } },
                       plugins: { legend: { display: false } } }
        });
    </script>
</main>
</body>
</html>
