<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/search/admin}">
<head>
    <title>색인 관리</title>
</head>
<body>
<main layout:fragment="content">
    <h1 class="text-lg font-bold mb-4">색인 관리</h1>

    <!-- 색인 현황 -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-5">
        <div class="bg-white border border-gray-200 rounded-xl p-4">
            <p class="text-[11px] text-gray-400">전체</p>
            <p class="text-xl font-bold" th:text="${total}">0</p>
        </div>
        <div th:each="c : ${counts}" class="bg-white border border-gray-200 rounded-xl p-4">
            <p class="text-[11px] text-gray-400" th:text="${docTypes.label(c.key)}">유형</p>
            <p class="text-xl font-bold" th:text="${c.value}">0</p>
        </div>
    </div>

    <!-- 마지막 실행 결과 -->
    <div class="bg-white border border-gray-200 rounded-xl p-4 mb-5 text-[13px]">
        <h2 class="text-sm font-semibold mb-2">마지막 실행 결과</h2>
        <p th:if="${lastResult == null}" class="text-gray-400">이번 기동 이후 실행 이력이 없습니다. (스케줄: 매일 06:00 / 18:00 + 기동 시 1회)</p>
        <p th:if="${lastResult != null}" class="text-gray-700">
            <span class="font-semibold" th:text="${lastResult.mode == 'diff' ? '동기화(diff)' : '전체 재색인(full)'}">모드</span>
            · 신규/변경 <span class="font-semibold" th:text="${lastResult.upserted}">0</span>건
            · 삭제 <span class="font-semibold" th:text="${lastResult.deleted}">0</span>건
            · <span th:text="${lastResult.elapsedMs}">0</span>ms
        </p>
    </div>

    <!-- 실행 버튼 -->
    <div class="flex gap-3">
        <form th:action="@{/adm/index/sync}" method="post">
            <button type="submit"
                    class="px-5 py-2.5 rounded-lg bg-primary text-white text-[14px] cursor-pointer hover:bg-primary/90">
                지금 동기화 (변경분만)
            </button>
        </form>
        <form th:action="@{/adm/index/rebuild}" method="post"
              onsubmit="return confirm('전체 재색인을 실행합니다. 문서 수가 많으면 시간이 걸릴 수 있습니다. 계속하시겠습니까?');">
            <button type="submit"
                    class="px-5 py-2.5 rounded-lg bg-gray-800 text-white text-[14px] cursor-pointer hover:bg-gray-700">
                전체 재색인 (전량 재분석)
            </button>
        </form>
    </div>
    <p class="mt-3 text-[12px] text-gray-500">
        동기화는 content_hash 비교로 변경분만 처리합니다. 단어사전·품사 설정 변경 후에는 전체 재색인을 실행하세요.
    </p>
</main>
</body>
</html>
