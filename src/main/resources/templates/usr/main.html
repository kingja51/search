<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/search/default}">
<head>
    <title>검색</title>
</head>
<body>
<main layout:fragment="content">
    <section style="padding: 64px 0 24px; text-align: center;">
        <h1 style="font-size: 26px; margin-bottom: 24px;">무엇을 찾고 계신가요?</h1>

        <!-- 검색 폼: 검색 기능은 3단계(검색 코어)에서 연결된다 -->
        <form th:action="@{/result}" method="get"
              style="display: flex; gap: 8px; max-width: 560px; margin: 0 auto;">
            <input type="text" name="q" placeholder="검색어를 입력하세요"
                   autocomplete="off" required
                   style="flex: 1; padding: 12px 16px; font-size: 15px;
                          border: 2px solid var(--primary); border-radius: 24px; outline: none;">
            <button type="submit"
                    style="padding: 12px 24px; font-size: 15px; border: none; border-radius: 24px;
                           background: var(--primary); color: #fff; cursor: pointer;">검색</button>
        </form>

        <p style="margin-top: 32px; color: var(--muted); font-size: 13px;">
            1단계 스캐폴딩 화면 — 추천·인기·내 검색어와 검색 결과는 이후 단계에서 연결됩니다.
        </p>
    </section>
</main>
</body>
</html>
