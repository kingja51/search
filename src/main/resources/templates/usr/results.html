<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/search/default}">
<head>
    <title th:text="${res.q} + ' 검색결과'">검색결과</title>
</head>
<body>
<main layout:fragment="content">
    <!-- 검색창 -->
    <form th:action="@{/result}" method="get"
          style="display:flex; gap:8px; max-width:560px; margin:24px 0;">
        <input type="text" name="q" th:value="${res.q}" required autocomplete="off"
               style="flex:1; padding:10px 14px; font-size:15px; border:2px solid var(--primary); border-radius:22px; outline:none;">
        <button type="submit"
                style="padding:10px 22px; border:none; border-radius:22px; background:var(--primary); color:#fff; cursor:pointer;">검색</button>
    </form>

    <!-- 금지어 차단 -->
    <div th:if="${res.blocked}" style="padding:32px 0; color:#dc2626;" th:text="${res.message}"></div>

    <th:block th:unless="${res.blocked}">
        <!-- 탭별 건수 -->
        <nav style="display:flex; gap:14px; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:18px; font-size:14px;">
            <a th:each="tab : ${res.tabCounts}"
               th:href="@{/result(q=${res.q}, type=${tab.key == 'ALL' ? null : tab.key}, sort=${cond.sort}, period=${cond.period}, op=${cond.op})}"
               th:style="${(cond.isAllTab() and tab.key == 'ALL') or (cond.type == tab.key)} ? 'font-weight:700; color:var(--primary);' : 'color:var(--muted);'">
                <span th:text="${tab.key == 'ALL' ? '전체' : tab.key}">탭</span>
                <span th:text="'(' + ${tab.value} + ')'">(0)</span>
            </a>
        </nav>

        <p th:if="${res.message}" style="padding:24px 0; color:var(--muted);" th:text="${res.message}"></p>

        <!-- 전체 탭: 도메인 그룹 뷰 (그룹당 10건 + 더보기) -->
        <section th:each="group : ${res.groups}" style="margin-bottom:28px;">
            <h2 style="font-size:16px; margin-bottom:10px;" th:text="${group.docType} + ' (' + ${group.total} + ')'">그룹</h2>
            <div th:each="item : ${group.items}" th:insert="~{usr/results :: resultItem(${item})}"></div>
            <a th:if="${group.hasMore}"
               th:href="@{/result(q=${res.q}, type=${group.docType}, sort=${cond.sort}, period=${cond.period}, op=${cond.op})}"
               style="display:inline-block; margin-top:6px; padding:7px 18px; border:1px solid var(--border); border-radius:18px; font-size:13px; color:var(--muted);">
                더보기 (<span th:text="${group.total}">0</span>건)
            </a>
        </section>

        <!-- 개별 탭: 페이징 뷰 -->
        <section th:if="${!cond.isAllTab()}">
            <div th:each="item : ${res.items}" th:insert="~{usr/results :: resultItem(${item})}"></div>
            <a th:if="${res.hasMore}"
               th:href="@{/result(q=${res.q}, type=${cond.type}, category=${cond.category}, sort=${cond.sort}, period=${cond.period}, op=${cond.op}, page=${cond.page + 1})}"
               style="display:inline-block; margin-top:10px; padding:7px 18px; border:1px solid var(--border); border-radius:18px; font-size:13px;">다음 페이지</a>
        </section>

        <p style="margin-top:24px; font-size:12px; color:var(--muted);"
           th:text="'총 ' + ${res.total} + '건 · ' + ${res.elapsedMs} + 'ms'"></p>
    </th:block>
</main>

<!-- 결과 1건 fragment: 제목·내용(발췌)·등록일·링크 + <mark> 하이라이트 (escape는 HighlightService에서 완료) -->
<div th:fragment="resultItem(item)" style="padding:12px 0; border-bottom:1px solid var(--border);">
    <a th:href="@{${item.linkUrl}}" style="font-size:15px; font-weight:600;" th:utext="${item.title}">제목</a>
    <p style="margin:6px 0; font-size:13px; line-height:1.6; color:#374151;" th:utext="${item.summary}">내용</p>
    <span style="font-size:12px; color:var(--muted);">
        <span th:text="${item.regDate}">2026.07.27</span>
        <span th:if="${item.category}" th:text="' · ' + ${item.category}"></span>
    </span>
</div>
</body>
</html>
