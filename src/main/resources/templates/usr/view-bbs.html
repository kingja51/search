<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/search/default}">
<head>
    <title th:text="${post != null ? post.title : '게시글'}">게시글</title>
</head>
<body>
<main layout:fragment="content">
    <section class="py-8" th:if="${post != null}">
        <p class="text-xs text-gray-400 mb-1" th:text="'게시판 · ' + ${post.boardCd}">게시판</p>
        <h1 class="text-xl font-bold mb-2" th:text="${post.title}">제목</h1>
        <p class="text-xs text-gray-400 border-b border-gray-200 pb-3 mb-4" th:text="${post.writer}">작성자</p>
        <div class="text-[14px] leading-relaxed text-gray-800 whitespace-pre-line"
             th:text="${post.content}">본문</div>
    </section>
    <section class="py-16 text-center text-gray-400" th:if="${post == null}">
        존재하지 않는 게시글입니다.
    </section>
    <div class="flex gap-2 mb-10">
        <a th:href="@{'/bbs/' + ${boardCd}}" class="px-4 py-1.5 border border-gray-200 rounded-full text-[13px] text-gray-500 hover:bg-gray-50">목록</a>
        <a th:href="@{/}" class="px-4 py-1.5 border border-gray-200 rounded-full text-[13px] text-gray-500 hover:bg-gray-50">← 검색으로</a>
    </div>
</main>
</body>
</html>
