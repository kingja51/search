<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 추천 검색어: 관리자 등록, display_order 순 칩 -->
<div th:fragment="recommend" th:if="${!#lists.isEmpty(recommend)}"
     class="flex flex-wrap items-center gap-2">
    <span class="text-xs font-semibold text-gray-500">추천</span>
    <a th:each="r : ${recommend}" th:href="@{/result(q=${r.keyword})}"
       class="px-3 py-1 text-[13px] rounded-full border border-primary/40 text-primary hover:bg-primary hover:text-white transition-colors"
       th:text="${r.keyword}">추천어</a>
</div>

<!-- 인기 검색어: 기간 탭(전체/실시간/1일/이번주/이번달) + TOP 10 실시간 집계 -->
<div th:fragment="popular" class="text-left" th:with="cur=${period != null ? period : 'all'}">
    <h3 class="text-sm font-bold mb-2.5">인기 검색어</h3>
    <div class="grid grid-cols-5 border border-gray-200 rounded-lg overflow-hidden mb-3 text-[11px] text-center">
        <button th:each="p, st : ${ {'all', '6h', '1d', 'week', 'month'} }" type="button"
                th:attr="hx-get=@{/api/keyword/popular(period=${p})}"
                hx-target="#popular-box" hx-swap="innerHTML"
                class="py-1.5 cursor-pointer"
                th:classappend="${(cur == p ? 'bg-primary text-white font-semibold' : 'bg-white text-gray-500 hover:bg-gray-50') + (st.first ? '' : ' border-l border-gray-200')}"
                th:text="${p == 'all' ? '전체' : (p == '6h' ? '실시간' : (p == '1d' ? '1일' : (p == 'week' ? '이번주' : '이번달')))}">전체</button>
    </div>
    <p th:if="${#lists.isEmpty(popular)}" class="text-[12px] text-gray-400 py-2">집계된 검색어가 없습니다.</p>
    <ol class="space-y-1.5" th:unless="${#lists.isEmpty(popular)}">
        <li th:each="p, st : ${popular}" class="flex items-center gap-2 text-[13px]">
            <span class="w-5 text-center font-bold"
                  th:classappend="${st.index < 3} ? 'text-primary' : 'text-gray-400'"
                  th:text="${st.count}">1</span>
            <a th:href="@{/result(q=${p.keyword})}" class="hover:underline" th:text="${p.keyword}">키워드</a>
            <span class="ml-auto text-[11px] text-gray-400" th:text="${p.searchCount}">0</span>
        </li>
    </ol>
</div>

<!-- 추천 검색어: 상단 파란 바용 (흰색 링크) -->
<th:block th:fragment="recommendBar">
    <a th:each="r : ${recommend}" th:href="@{/result(q=${r.keyword})}"
       class="px-2 py-1 text-[13px] text-white/90 hover:text-white hover:underline whitespace-nowrap"
       th:text="${r.keyword}">추천어</a>
</th:block>

<!-- 인기 검색어 드롭다운: 검색창 포커스(빈 입력) 시 노출 -->
<div th:fragment="popularDropdown" th:if="${!#lists.isEmpty(popular)}"
     class="bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden">
    <p class="px-4 pt-2.5 pb-1 text-[11px] font-semibold text-gray-400">인기 검색어</p>
    <a th:each="p, st : ${popular}" th:href="@{/result(q=${p.keyword})}"
       class="flex items-center gap-2 px-4 py-2 text-[13px] hover:bg-gray-50">
        <span class="w-4 text-center font-bold"
              th:classappend="${st.index < 3} ? 'text-primary' : 'text-gray-400'"
              th:text="${st.count}">1</span>
        <span th:text="${p.keyword}">키워드</span>
    </a>
</div>

<!-- 내 검색어: API(/api/keyword/my) 용 fragment (session -> IP 폴백) -->
<div th:fragment="myKeywords" th:if="${!#lists.isEmpty(myKeywords)}"
     class="bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden">
    <p class="px-4 pt-2.5 pb-1 text-[11px] font-semibold text-gray-400">내 검색어</p>
    <a th:each="m : ${myKeywords}" th:href="@{/result(q=${m.keyword})}"
       class="block px-4 py-2 text-[13px] hover:bg-gray-50" th:text="${m.keyword}">키워드</a>
</div>

<!-- 자동완성 드롭다운 -->
<div th:fragment="autocomplete" th:if="${!#lists.isEmpty(suggestions)}"
     class="bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden">
    <a th:each="s : ${suggestions}" th:href="@{/result(q=${s})}"
       class="block px-4 py-2 text-[13px] hover:bg-gray-50" th:text="${s}">제목</a>
</div>

<!-- 빈 응답 (2글자 미만 등) -->
<th:block th:fragment="empty"></th:block>

</body>
</html>
