<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - 통합검색">통합검색</title>
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}" defer></script>
    <!-- Tailwind CSS v4 (CDN — 운영 전환 시 빌드 방식 검토) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-primary: #2563eb;
        }
        mark {
            background-color: #fef08a;
            padding: 0 1px;
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-white text-gray-900">
<header class="border-b border-gray-200">
    <div class="max-w-3xl mx-auto px-4 py-3.5 flex items-center gap-3">
        <a class="text-lg font-bold text-primary" th:href="@{/}">🔍 통합검색</a>
    </div>
</header>

<main class="max-w-3xl mx-auto px-4 w-full flex-1" layout:fragment="content">
    <!-- 각 페이지 본문이 여기에 채워진다 -->
</main>

<footer class="border-t border-gray-200 mt-12 py-5 text-center text-xs text-gray-400">
    search engine · PostgreSQL 18 + Nori
</footer>
</body>
